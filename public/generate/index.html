<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume · Kenneth Chen Ko Han</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.5; }

    /* ── password screen: barebones ─────────────────────────────── */
    .lock { min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 24px; }
    .lock form { display: flex; gap: 8px; }
    .lock input { font: inherit; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
    .lock button { font: inherit; padding: 8px 14px; border: 0; border-radius: 6px;
      background: #171717; color: #fff; cursor: pointer; }
    .lock button:hover { opacity: .88; }
    #err { margin: 0; min-height: 18px; color: #b42318; font-size: 14px; }

    /* ── toolbar (not printed) ──────────────────────────────────── */
    .bar { display: flex; gap: 8px; justify-content: center; padding: 10px;
      border-bottom: 1px solid #e8e8e6; }
    .bar button { font: inherit; padding: 6px 14px; border: 1px solid #ccc;
      border-radius: 6px; background: #fff; cursor: pointer; }
    .bar .primary { background: #171717; color: #fff; border-color: #171717; }

    /* ── resume ─────────────────────────────────────────────────── */
    .resume { max-width: 820px; margin: 0 auto; padding: 24px 32px 48px; }
    .resume h1 { font-size: 24px; margin: 0; }
    .contact { list-style: none; padding: 0; margin: 6px 0 0; display: flex;
      flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: #444; }
    .contact li::after { content: "·"; margin-left: 10px; color: #bbb; }
    .contact li:last-child::after { content: ""; }
    .resume section { border-top: 1px solid #e8e8e6; padding-top: 12px; margin-top: 12px; }
    .resume h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      color: #6b6b6b; margin: 0 0 8px; }
    .job { margin-bottom: 10px; }
    .job__top { display: flex; justify-content: space-between; gap: 12px; }
    .job__role { font-weight: 600; margin: 0; }
    .job__org { margin: 1px 0 0; font-size: 13px; color: #666; }
    .job__date { font-size: 12px; color: #6b6b6b; white-space: nowrap; }
    .job__body { margin: 4px 0 0; }
    .tags { list-style: none; padding: 0; margin: 5px 0 0; display: flex; flex-wrap: wrap; gap: 3px 8px; }
    .tags li { font-size: 11.5px; color: #6b6b6b; }
    a { color: inherit; text-decoration: none; border-bottom: 1px solid #ccc; }

    @media print {
      .bar, .lock { display: none !important; }
      body { font-size: 11.5px; }
      .resume { max-width: none; padding: 0; }
      .job { break-inside: avoid; }
      @page { size: A4; margin: 12mm 14mm; }
    }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden>
    <button class="primary" onclick="window.print()">Print / Save PDF</button>
    <button onclick="location.reload()">Lock</button>
  </div>

  <div class="lock" id="lock">
    <form id="lockform">
      <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus aria-label="Password">
      <button type="submit">Unlock</button>
    </form>
    <p id="err" hidden></p>
  </div>

  <article class="resume" id="resume" hidden></article>

<script>
// Injected by scripts/generate.mjs (single source of truth = content.json).
const RESUME = {"name":"Kenneth Chen Ko Han","tagline":"AI Engineer","location":"Singapore","email":"kenneth.chen1337@gmail.com","links":{"github":"https://github.com/kenJPG","linkedin":"https://linkedin.com/in/kenneth-chen-ko-han","huggingface":"https://huggingface.co/qenneth"},"experience":[{"company":"Makeable.build","role":"Technical Interviewer","date":"July 2026 - Present","description":"San Francisco startup backed by Afore Capital, with $250K in pre-seed funding. I designed and run the technical interview loop, assessing the engineering candidates the founders shortlist.","url":"https://makeable.build"},{"company":"Resumify","logo":"resumify.png","role":"AI Lead, Co-founder","date":"2023 - 2026","description":"Co-founded non-profit with YellowRibbon.gov.sg, HTX, and Singapore Prison Service. AI-powered resume services now delivered to 600+ users. Collaborating with SPD (Society for the Physically Disabled); hosted a sharing session training career facilitators on using the platform. Awarded SGD 24,000 in funding by the National Youth Council. Signed 12-month MOU with YellowRibbon. Featured in The Business Times and [Lianhe Zaobao](https://www.zaobao.com.sg/realtime/singapore/story20250729-7237751).","tech":"Next.js, LLM Agents, OpenAI API, ElevenLabs, Vercel, Render, Supabase, SQL","url":"https://resumify.org"},{"company":"Republic of Singapore Air Force (RAiD)","logo":"raid.png","role":"AI Engineer Volunteer","date":"2023 - June 2026","description":"Built the full-stack system that analyses Air Traffic Control situations: an NVIDIA NeMo speech recognition and speaker diarisation layer (finetuned parakeet-tdt, canary-1b and NGPU-LM) feeding a Qwen3 reasoning layer served with vLLM, deployed to edge devices for real-time transcription in the control room. Built an LLM-powered internal search tool at a RAiD hackathon hosted at Microsoft's office.","tech":"NVIDIA NeMo, vLLM, Qwen3, PyTorch, Edge Deployment"},{"company":"Bifrost AI","logo":"bifrost.jpeg","role":"AI Intern","date":"2024","description":"Series A startup building synthetic data solutions for AI companies, backed by Sequoia Capital. Prototyped a zero-shot method with JinaCLIP to visualise missing data for NASA, BigBear AI and DSTA. Trained YOLOv6-lite for military tank detection with ST Engineering's Unmanned Vehicles Team; tuning for incremental learning lifted accuracy 16%+. Fine-tuned a StabilityAI VAE for synthetic-to-real domain adaptation.","tech":"YOLO, VAE, JinaCLIP, OpenCV"},{"company":"GovTech Singapore","logo":"govtech.png","role":"AI Engineer Intern","date":"2023 - 2024","description":"Video Analytics team, Data Science and AI Division. Red-teamed GovTech's AI Image Detector with custom-trained LoRAs. Lead AI engineer on a computer vision pipeline for MSO's OneService App on AWS (EKS, SageMaker), classifying thousands of daily municipal reports via zero-shot ensembles. Built real-time animal welfare detection for NParks with OWLv2, tuned by Bayesian optimisation (Hyperopt). Prototyped a novel object-detection explainability method using SegGPT and SAM.","tech":"OWLv2, LoRA, Few-Shot Segmentation, XAI"}],"research":[{"title":"Unserious research","org":"2025","detail":"State-of-the-art 5.99% Word Error Rate on the [Air Traffic Control Automatic Speech Recognition (ATC-ASR) benchmark](https://huggingface.co/qenneth/parakeet-tdt-0.6b-v3-finetuned-for-ATC), with a parakeet-tdt-0.6b-v3 finetuned in under an hour on a single H200. Peaked at 200+ downloads a month, now averaging around 70"},{"title":"SEA-VL Contributor","org":"SEACrowd, 2025","detail":"Co-author on [Crowdsource, Crawl, or Generate? Creating SEA-VL](https://aclanthology.org/2025.acl-long.916/), ACL 2025 Main Conference — annotated Myanmar-specific imagery and contributed to the writing"},{"title":"Founder, Competitive Programming Interest Group","org":"SP, 2022","detail":"150+ member Discord / 3 workshops / 3 competitions / team ranked top 6% globally at Reply CodeTeen"},{"title":"Vice President, AI Club","org":"SP, 2022","detail":"Nationwide hackathon across all 5 polytechnics, sponsored by Google and AI Singapore"}],"education":[{"school":"National University of Singapore, NUS College","date":"2026 - May 2029","degree":"Bachelors in Computer Science, Minor in Mathematics","awards":"NUS Merit Scholarship — awarded to high-calibre freshmen on academic results, leadership qualities and co-curricular record"},{"school":"Singapore Polytechnic","date":"2021 - 2024","degree":"Diploma in Applied AI and Analytics","awards":"Lee Kuan Yew Award for Mathematics & Science (top tech graduate) / IMDA Gold Medal (top all-around achiever) / SP Scholarship","gpa":"4.0 / 4.0","coursework":"Deep Learning, Machine Learning, Reinforcement Learning, Full-Stack Development, DevOps, Data Analytics, Data Engineering, Data Visualisation"}],"skills":{"Languages":"Python, C++, TypeScript, JavaScript, SQL, HTML, CSS, Bash","Machine Learning":"PyTorch, Hugging Face, NVIDIA NeMo, vLLM, scikit-learn, NumPy, Pandas, OpenCV, LoRA, Hyperopt, Weights & Biases","Web & Data":"Next.js, React, FastAPI, Node.js, Tailwind CSS, MySQL, MongoDB, Supabase, OpenAI API","Cloud & Tooling":"AWS, AWS EKS, AWS SageMaker, Docker, Vercel, Render, Git, LaTeX, Typst"}};

const enc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const link = (label, url) => `<a href="${enc(url)}" rel="noreferrer" target="_blank">${enc(label)}</a>`;

// Accepts a comma-separated string OR an array - experience `tech` and
// education `coursework` arrive as strings, skills values as strings too.
const tags = (v) => {
  const arr = Array.isArray(v) ? v : String(v || "").split(",");
  return arr.map((t) => t.trim()).filter(Boolean).map((t) => `<li>${enc(t)}</li>`).join("");
};

const b64ToBytes = (s) => {
  const bin = atob(s); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) a[i] = bin.charCodeAt(i);
  return a;
};
// AES-GCM in Web Crypto wants ciphertext || tag concatenated (Node's cipher
// API takes the tag separately). flatMap must spread into arrays to flatten.
const cat = (...b64) => Uint8Array.from(b64.flatMap((s) => [...b64ToBytes(s)]));

function renderExperience(list) {
  return list.map((e) => `<div class="job">
    <div class="job__top">
      <div>
        <p class="job__role">${enc(e.role)}</p>
        <p class="job__org">${e.url ? link(e.company, e.url) : enc(e.company)}</p>
      </div>
      <span class="job__date">${enc(e.date)}</span>
    </div>
    ${e.description ? `<p class="job__body">${enc(e.description)}</p>` : ""}
    ${e.tech ? `<ul class="tags">${tags(e.tech)}</ul>` : ""}
  </div>`).join("");
}

function renderResearch(list) {
  return list.map((e) => `<div class="job">
    <div class="job__top">
      <p class="job__role">${enc(e.title)}</p>
      <span class="job__date">${enc(e.org)}</span>
    </div>
    ${e.detail ? `<p class="job__body">${enc(e.detail)}</p>` : ""}
  </div>`).join("");
}

function renderEducation(list) {
  return list.map((e) => `<div class="job">
    <div class="job__top">
      <div>
        <p class="job__role">${enc(e.school)}</p>
        <p class="job__org">${enc(e.degree)}</p>
      </div>
      <span class="job__date">${enc(e.date)}</span>
    </div>
    ${e.gpa ? `<p class="job__body">GPA ${enc(e.gpa)}</p>` : ""}
    ${e.awards ? `<p class="job__body">${enc(e.awards)}</p>` : ""}
    ${e.coursework ? `<ul class="tags">${tags(e.coursework)}</ul>` : ""}
  </div>`).join("");
}

function renderSkills(skills) {
  return Object.entries(skills).map(([label, value]) =>
    `<div class="job"><p class="job__org">${enc(label)}</p><ul class="tags">${tags(value)}</ul></div>`
  ).join("");
}

function showResume(c) {
  const r = RESUME;
  const contact = [
    c.phone ? `<li><strong>${enc(c.phone)}</strong></li>` : "",
    c.email ? `<li>${link(c.email, "mailto:" + c.email)}</li>` : "",
    c.location ? `<li>${enc(c.location)}</li>` : "",
    r.links.github ? `<li>${link("github", r.links.github)}</li>` : "",
    r.links.linkedin ? `<li>${link("linkedin", r.links.linkedin)}</li>` : "",
  ].join("");

  document.getElementById("resume").innerHTML = `
    <header>
      <h1>${enc(r.name)}</h1>
      ${r.tagline ? `<p class="job__org">${enc(r.tagline)}</p>` : ""}
      <ul class="contact">${contact}</ul>
    </header>
    <section><h2>Experience</h2>${renderExperience(r.experience || [])}</section>
    <section><h2>Research &amp; Community</h2>${renderResearch(r.research || [])}</section>
    <section><h2>Education</h2>${renderEducation(r.education || [])}</section>
    <section><h2>Skills</h2>${renderSkills(r.skills || {})}</section>`;

  document.getElementById("lock").hidden = true;
  document.getElementById("resume").hidden = false;
  document.getElementById("bar").hidden = false;
}

async function unlock(event) {
  event.preventDefault();
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.hidden = true;
  if (!pw) return;

  let blob;
  try {
    const res = await fetch("contact.enc.json");
    if (!res.ok) throw new Error("load");
    blob = await res.json();
  } catch {
    err.hidden = false; err.textContent = "Could not load data.";
    return;
  }

  let contact;
  try {
    const material = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: b64ToBytes(blob.salt), iterations: blob.iterations, hash: "SHA-256" },
      material, 256);
    const key = await crypto.subtle.importKey("raw", bits, { name: "AES-GCM" }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(blob.nonce) }, key, cat(blob.ciphertext, blob.tag));
    contact = JSON.parse(new TextDecoder().decode(plain));
  } catch {
    err.hidden = false; err.textContent = "Wrong password.";
    return;
  }

  // Outside the decrypt try/catch on purpose: a render error must not read as
  // a bad password (that was the old bug).
  showResume(contact);
}

document.getElementById("lockform").addEventListener("submit", unlock);
</script>
</body>
</html>
